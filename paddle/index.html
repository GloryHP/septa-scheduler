<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheduler App</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --ink: #0a0b0d;
  --ink2: #13151a;
  --ink3: #1d2028;
  --line: rgba(255,255,255,0.07);
  --line2: rgba(255,255,255,0.13);
  --line3: rgba(255,255,255,0.22);
  --dim: #4a4f5e;
  --mid: #8a909f;
  --text: #c8cdd8;
  --bright: #e8ecf4;
  --amber: #f5a623;
  --amber-dim: rgba(245,166,35,0.12);
  --green: #3dd68c;
  --green-dim: rgba(61,214,140,0.1);
  --blue: #4d9fff;
  --blue-dim: rgba(77,159,255,0.1);
  --red: #ff6b6b;
  --red-dim: rgba(255,107,107,0.1);
  --violet: #a78bfa;
  --violet-dim: rgba(167,139,250,0.1);
  --sans: 'IBM Plex Sans Condensed', sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}

html { font-size: 16px; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content:'';
  position:fixed;inset:0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
  pointer-events:none;z-index:1000;
}

header {
  background: var(--ink2);
  border-bottom: 1px solid var(--line2);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  height: auto;
  position: sticky;
  top: 0;
  z-index: 200;
  justify-content: space-between;
}

.hd-depot {
  display:flex;align-items:center;gap:12px;
  flex: 1 1 auto;
  min-width: 0;
}

.hd-dot {
  width:8px;height:8px;border-radius:50%;
  background:var(--amber);
  opacity: 0.7;
  animation: pulse 2.5s ease-in-out infinite;
}

@keyframes pulse {0%,100%{transform: scale(1.2);opacity:.8} 50%{transform: scale(.9);opacity:.3} }

.hd-selects {
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:flex-start;
  gap:12px;
  min-width:0;
}

.hd-season-select {
  font-family:var(--mono);
  font-size:12px;
  background:none;border:none;
  color:var(--amber);
  padding:0;
  cursor:pointer;
  font-weight:600;
  letter-spacing:.04em;
  width:clamp(130px, 22vw, 220px);
  min-width:0;
}

.hd-season-select:hover {
  color:var(--bright);
}

.hd-depot-select {
  font-family:var(--mono);
  font-size:15px;
  background:none;border:none;
  color:var(--bright);
  padding:0;
  cursor:pointer;
  font-weight:600;
  letter-spacing:.04em;
  width:clamp(160px, 28vw, 280px);
  min-width:0;
}

.hd-depot-select:hover {
  color:var(--amber);
}

.hd-pick {
  font-size:12px;
  color:var(--dim);
  margin-top:2px;
}

.btn-live {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  background: var(--red);
  color: var(--bright);
  border: none;
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  text-decoration: none;
  transition: all .15s;
  letter-spacing: .04em;
  flex: 0 0 auto;
}

.btn-live:hover {
  background: #ff5252;
  transform: translateY(-1px);
}

.toolbar {
  background:var(--ink2);
  border-bottom:1px solid var(--line);
  padding:14px;
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

/* ===== WEEK BOARD =====
   Seven columns, one per day of the week, starting with Sunday. Each
   column header holds a run-number input that resolves against that
   day's own roster ONLY - a number typed under Sunday never picks up
   a Weekday run. The cards themselves are the untouched card CSS. */
.week-board {
  display: grid;
  grid-template-columns: repeat(7, minmax(230px, 1fr));
  gap: 12px;
  align-items: start;
  padding: 16px 12px 40px;
  overflow-x: auto;
}

.week-col {
  min-width: 0;
}

.week-col-head {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--ink2);
  border: 1px solid var(--line2);
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  padding: 8px;
}

.week-day {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  flex: 0 0 auto;
}

.week-col.day-Sunday .week-day { color: var(--green); }
.week-col.day-Weekday .week-day { color: var(--amber); }
.week-col.day-Saturday .week-day { color: var(--blue); }

.week-input {
  flex: 1 1 auto;
  min-width: 0;
  background: var(--ink3);
  border: 1px solid var(--line2);
  color: var(--bright);
  font-family: var(--mono);
  font-size: 14px;
  padding: 6px 8px;
  border-radius: 4px;
  outline: none;
  transition: border-color .15s;
}

.week-input:focus { border-color: var(--amber); }
.week-input::placeholder { color: var(--dim); }

.week-all {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .06em;
  background: var(--ink3);
  border: 1px solid var(--line2);
  color: var(--dim);
  padding: 6px 8px;
  border-radius: 4px;
  cursor: pointer;
  transition: all .15s;
  flex: 0 0 auto;
}

.week-all:hover { color: var(--text); border-color: var(--line3); }
.week-all.active { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }

.week-col-body {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-top: 12px;
}

.week-hint {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  text-align: center;
  padding: 18px 8px;
  border: 1px dashed var(--line2);
  border-radius: 6px;
}

.week-hint b { color: var(--amber); }

.search-row {
  display: flex;
  gap: 8px;
  flex: 1 1 auto;
  min-width: 280px;
}

.search-wrap {
  position:relative;
  flex: 1 1 auto;
  min-width: 100px;
}

.search-wrap svg {
  position:absolute;
  left:9px;
  top:50%;
  transform:translateY(-50%);
  color:var(--dim);
  pointer-events:none;
}

.search-wrap input {
  width:100%;
  background:var(--ink3);
  border:1px solid var(--line2);
  color:var(--bright);
  font-family:var(--mono);
  font-size:14px;
  padding:10px 10px 10px 30px;
  border-radius:4px;
  outline:none;
  transition:border-color .15s;
}

.search-wrap input:focus{border-color:var(--amber);}
.search-wrap input::placeholder{color:var(--dim);}

/* ===== END-OF-TOOLBAR GROUP: sort + run count =====
   Kept in one flex box so the three always sit on a line together and
   wrap as a single unit rather than splitting up. */
.tool-end {
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  flex:1 1 auto;
  min-width:0;
}

/* Toggle-style button (manual "picked runs" overlay). */
.btn-only {
  font-family:var(--mono);
  font-size:12px;
  font-weight:600;
  letter-spacing:.04em;
  background:var(--ink3);
  border:1px solid var(--line2);
  color:var(--mid);
  padding:8px 12px;
  border-radius:4px;
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:6px;
}

.btn-only:hover { border-color:var(--line3);color:var(--text); }

.btn-only.active {
  background:var(--violet-dim);
  border-color:var(--violet);
  color:var(--violet);
}

/* little on/off marker so the pressed state reads at a glance */
.btn-only .tick {
  font-size:10px;
  opacity:.55;
}

.btn-only.active .tick { opacity:1; }

/* Manual "picked runs" overlay row - Callowhill Bus / Fall 2026 only. */
.gone-runs-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  width: 100%;
}

.gone-runs-updated {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  white-space: nowrap;
}

.sort-sel {
  background:var(--ink3);
  border:1px solid var(--line2);
  color:var(--text);
  font-family:var(--mono);
  font-size:13px;
  padding:8px 10px;
  border-radius:4px;
  outline:none;
  cursor:pointer;
}

/* bare match count - no label, so give the digits enough weight to read
   as a value rather than stray text */
.result-line {
  font-family:var(--mono);
  font-size:15px;
  font-weight:700;
  color:var(--amber);
  white-space:nowrap;
  flex: 0 0 auto;
}

.result-line strong { color:var(--amber);font-weight:700; }

.card {
  background:var(--ink2);
  border:1px solid var(--line2);
  border-radius:6px;
  overflow:hidden;
  transition:border-color .2s, transform .15s;
  position:relative;
}

.card:hover {
  border-color:var(--line3);
  transform:translateY(-1px);
}

.card::before {
  content:'';
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
}

.card.day-Sunday::before { background:var(--green); }
.card.day-Weekday::before { background:var(--amber); }
.card.day-Saturday::before { background:var(--blue); }

.card-head {
  display: grid;
  grid-template-rows: auto auto;
  gap: 0;
  border-bottom:1px solid var(--line);
  background:var(--ink3);
}

.card-head-top {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding: 6px 12px;
  gap: 8px;
  border-bottom: 1px solid var(--line);
}

.run-day {
  font-size:11px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--amber);
  flex-shrink: 0;
}

.card.day-Sunday .run-day { color:var(--green); }
.card.day-Weekday .run-day { color:var(--amber); }
.card.day-Saturday .run-day { color:var(--blue); }

.run-num-label {
  font-family:var(--mono);
  font-size:11px;
  font-weight:600;
  color:var(--bright);
  flex-shrink: 0;
  display: none;
}

.run-num {
  font-family:var(--mono);
  font-size:16px;
  font-weight:700;
  color:var(--amber);
  line-height:1;
  flex-shrink: 0;
}

.card.day-Sunday .run-num { color:var(--green); }
.card.day-Weekday .run-num { color:var(--amber); }
.card.day-Saturday .run-num { color:var(--blue); }

.run-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.run-picked-badge {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .02em;
  text-transform: uppercase;
  color: var(--red);
  background: var(--red-dim);
  border: 1px solid var(--red);
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
  flex-shrink: 0;
}

.btn-paddle {
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
  letter-spacing:.06em;
  background:var(--blue);
  border:1px solid var(--blue);
  color:#0a1020;
  padding:4px 10px;
  border-radius:4px;
  cursor:pointer;
  text-decoration:none;
  display:none;
  align-items:center;
  gap:3px;
  transition:all .15s;
  white-space:nowrap;
  flex-shrink: 0;
}

.btn-paddle.show {
  display: inline-flex;
}

.btn-paddle:hover{
  border-color:#6fb4ff;
  background:#6fb4ff;
  color:#0a1020;
}

.btn-paddle:active{
  background:#3c8ae6;
  border-color:#3c8ae6;
}

.card-head-bottom {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 6px 12px;
}

.run-routes {
  font-family:var(--mono);
  font-size:11px;
  font-weight:600;
  color:var(--bright);
  letter-spacing:.01em;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stats-row {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  border-bottom:1px solid var(--line);
}

.stat {
  padding:10px 12px;
  border-right:1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.stat:last-child{border-right:none;}

.stat-label {
  font-size:10px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--dim);
  margin-bottom:3px;
}

.stat-val {
  font-family:var(--mono);
  font-size:16px;
  font-weight:700;
  color:var(--bright);
  line-height: 1.1;
}

.stat-val.pay { color:var(--amber); }

.swing-section {
  padding:6px 12px;
  border-top:1px solid var(--line);
  background:var(--ink3);
  font-family:var(--mono);
  font-size:10px;
  color:var(--mid);
  display: flex;
  justify-content: flex-start;
  gap: 2px;
}

.swing-label {
  color:var(--dim);
  font-weight: 600;
}

.swing-value {
  color:var(--violet);
  font-weight: 600;
}

.timeline { 
  padding:12px 14px 12px 17px; 
}

.seg {
  display:flex;
  align-items:stretch;
  gap:0;
  margin-bottom:6px;
  position:relative;
}

.seg:last-child{ margin-bottom:0; }

.seg-connector {
  width:16px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  margin-right:8px;
}

.seg-dot {
  width:8px;
  height:8px;
  border-radius:50%;
  border:2px solid;
  flex-shrink:0;
  margin-top:4px;
  z-index:1;
  border-color:var(--green);
  background:var(--green);
}

.seg-line {
  width:1px;
  background:var(--line2);
  flex:1;
  margin-top:2px;
}

.seg:last-child .seg-line { display:none; }

.seg-body { 
  flex:1;
  min-width:0;
  padding-bottom:6px; 
}

.seg-top {
  display:flex;
  align-items:baseline;
  gap:6px;
  margin-bottom:3px;
  flex-wrap: wrap;
}

.seg-route {
  font-family:var(--mono);
  font-size:14px;
  font-weight:600;
  color:var(--bright);
  min-width:36px;
}

.seg-block {
  font-family:var(--mono);
  font-size:13px;
  font-weight:600;
  letter-spacing:.08em;
  color:var(--bright);
  background:var(--ink3);
  border:1px solid var(--line3);
  border-radius:3px;
  padding:2px 6px;
}

.seg-block-label {
  font-family:var(--mono);
  font-size:9px;
  font-weight:600;
  letter-spacing:.1em;
  color:var(--dim);
  margin-right:-2px;
}

.seg-sched {
  font-family:var(--mono);
  font-size:11px;
  color:var(--mid);
  margin-left:auto;
}

.seg-times {
  display:flex;
  align-items:center;
  gap:4px;
  font-family:var(--mono);
  font-size:12px;
  color:var(--mid);
  flex-wrap: wrap;
}

.seg-time-tag {
  font-size:10px;
  font-weight:600;
  letter-spacing:.05em;
  padding:1px 4px;
  border-radius:2px;
  background:var(--green-dim);
  color:var(--green);
}

.seg-arrow { color:var(--dim);font-size:10px; }

.error {
  background: var(--red-dim);
  border: 1px solid var(--red);
  color: var(--red);
  padding: 20px;
  border-radius: 4px;
  margin: 20px;
  font-family: var(--mono);
  font-size: 14px;
}

/* ===== MOBILE RESPONSIVENESS ===== */
@media (max-width: 768px) {
  html { font-size: 16px; }
  
  header {
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
  }
  
  .btn-live {
    padding: 8px 12px;
    font-size: 12px;
  }
  
  .toolbar {
    flex-direction: column;
    gap: 12px;
  }
  
  .search-row {
    width: 100%;
    min-width: unset;
  }
  
  .search-wrap {
    flex: 1;
    min-width: unset;
  }
  
  .tool-end {
    width: 100%;
    gap: 8px;
  }

  /* sort takes the remaining room; the toggle keeps its own width */
  .sort-sel {
    flex: 1 1 auto;
    min-width: 0;
  }

  /* bigger tap target on phones */
  .btn-only {
    padding: 12px;
    font-size: 12px;
  }

  .result-line {
    width: auto;
  }
  
  /* --- CARD HEADER FIX: two clear rows, no overlap --- */
  .card-head {
    display: flex;
    flex-direction: column;
  }

  .card-head-top {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    padding: 4px 10px;
    flex-wrap: nowrap;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }

  .run-day {
    font-size: 12px;
    letter-spacing: .04em;
    flex-shrink: 0;
  }

  .run-num-label {
    display: none;
  }

  .run-num {
    font-size: 20px;
    flex-shrink: 0;
  }

  .run-actions {
    margin-left: auto;
    flex-shrink: 0;
  }

  .btn-paddle {
    font-size: 10px;
    padding: 4px 9px;
    flex-shrink: 0;
  }

  .card-head-bottom {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 6px 10px;
  }

  .run-routes {
    font-size: 11px;
    text-align: right;
  }
  /* --- END CARD HEADER FIX --- */

  .swing-section {
    font-size: 12px;
    padding: 6px 10px;
    gap: 4px;
  }

  .stat-val {
    font-size: 17px;
  }
  
  .seg-route {
    font-size: 13px;
  }
}

@media (max-width: 480px) {
  html { font-size: 16px; }
  
  .search-wrap input {
    font-size: 16px;
  }
  
  .week-board {
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    overflow-x: visible;
  }
  
  .run-num {
    font-size: 18px;
  }
  
  .stat-val {
    font-size: 16px;
  }
  
  .seg-times {
    font-size: 11px;
  }

  .run-routes {
    font-size: 10px;
  }

  .run-day {
    font-size: 11px;
  }
  
  .btn-live {
    padding: 6px 10px;
    font-size: 11px;
  }
}
.summary-card {
  margin: 12px;
  padding: 12px 16px;
  background: var(--ink2);
  border: 1px solid var(--line2);
  border-radius: 6px;
  display: flex;
  gap: 24px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
}
.summary-card .sc-item { display: flex; flex-direction: column; }
.summary-card .sc-label { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 3px; }
.summary-card .sc-val { font-size: 18px; font-weight: 700; color: var(--bright); }
.summary-card .sc-val.pay { color: var(--amber); }
</style>
</head>
<body>

<header>
  <div class="hd-depot">
    <div class="hd-dot"></div>
    <div class="hd-selects">
      <select class="hd-season-select" id="season-select" onchange="changeSeason()">
        <option value="">Loading...</option>
      </select>
      <select class="hd-depot-select" id="district-select" onchange="changeDistrict()">
        <option value="">Loading districts...</option>
      </select>
    </div>
  </div>
</header>





  <div class="tool-end">

  </div>
</div>

<div class="summary-card" id="summary"></div>

<div class="week-board" id="board"></div>

<script>
const isMobile = window.innerWidth <= 768;
const DAY_ORDER = ['Sunday', 'Weekday', 'Saturday'];

// ==========================================================================
// WEEK BOARD - seven slots, one per day of the week, starting with Sunday.
//
// Each slot takes a run number and resolves it against THAT DAY'S OWN roster
// only, so a number typed under Sunday can never pick up a Weekday run.
//
//   Sunday    -> sunday.csv
//   Mon-Fri   -> weekday.csv   (the Mon-Fri roster)
//   Saturday  -> saturday.csv
//
// `group` only drives the card colour, so Mon-Fri share the amber weekday
// styling the old day buttons used.
// ==========================================================================
const WEEK_DAYS = [
  { key: 'Sunday',    label: 'Sun', group: 'Sunday'   },
  { key: 'Monday',    label: 'Mon', group: 'Weekday' },
  { key: 'Tuesday',   label: 'Tue', group: 'Weekday' },
  { key: 'Wednesday', label: 'Wed', group: 'Weekday' },
  { key: 'Thursday',  label: 'Thu', group: 'Weekday' },
  { key: 'Friday',    label: 'Fri', group: 'Weekday' },
  { key: 'Saturday',  label: 'Sat', group: 'Saturday' }
];

// Mon-Fri share one roster, so they fall back to it when the manifest does
// not name a day exactly.
const WEEKDAY_SLOTS = new Set(['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday']);

// ==========================================================================
// SEASONS - step 1 of the picker. Each entry becomes one option in the
// "Season" dropdown and points at its own manifest file.
//
// To RETIRE SUMMER later: just delete the summer line below. Fall then
// becomes the default, and the Season dropdown auto-hides while only one
// season remains (so it looks like the single-dropdown app does today).
// The order here is the display order; the first entry is the default.
// ==========================================================================
const SEASONS = [
  { id: 'fall2026', label: 'Fall 2026', manifest: 'data/manifest-fall-2026.json' }
];

// Manual "picked runs" overlay, read from a Google Sheet the depot owner
// updates by hand. Scoped to Callowhill Bus / Fall 2026 only.
const GONE_RUNS_SHEET_ID = '1XY9tVEzQGxCO010RNkCFARXEt_5nqxUm_etTlh7cjZA';
const GONE_RUNS_DISTRICT = 'callowhillb-fall-2026';
const GONE_RUNS_CONFIG_GID = '999225285';
const GONE_RUNS_DAY_GIDS = { Weekday: '275440213', Saturday: '553516250', Sunday: '1260882798' };

let STATE = {
  currentSeason: null,
  manifest: null,
  currentDistrict: null,
  weekInputs: {},
  showAllSlots: new Set(),
  runs: [],
  availableDays: [],
  pdfLinks: {},
  goneRunsEnabled: false,
  goneRunsUpdated: '',
  goneRuns: {},
  showOpenOnly: false,
  selectedRun: null
};

function parseCSV(csvText) {
  const lines = csvText.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
  return lines.slice(1)
    .filter(line => line.trim())
    .map(line => {
      const values = line.split(',').map(v => v.trim());
      const obj = {};
      headers.forEach((header, i) => { obj[header] = values[i] || ''; });
      return obj;
    });
}

function goneRunsSheetUrl(gid) {
  return `https://docs.google.com/spreadsheets/d/${GONE_RUNS_SHEET_ID}/export?format=csv&gid=${gid}`;
}

async function loadGoneRunsConfig() {
  try {
    const res = await fetch(goneRunsSheetUrl(GONE_RUNS_CONFIG_GID));
    if (!res.ok) throw new Error('config fetch failed');
    const text = await res.text();
    const map = {};
    text.trim().split('\n').forEach(line => {
      const [key, value] = line.split(',').map(v => (v || '').trim());
      if (key) map[key.toLowerCase()] = value || '';
    });
    STATE.goneRunsEnabled = (map['filtering test'] || '').toLowerCase() === 'yes';
    STATE.goneRunsUpdated = map['date'] || '';
  } catch (e) {
    STATE.goneRunsEnabled = false;
    STATE.goneRunsUpdated = '';
  }
}

async function loadGoneRunsForDay(day) {
  STATE.goneRuns[day] = new Map();
  const gid = GONE_RUNS_DAY_GIDS[day];
  if (!gid) return;
  try {
    const res = await fetch(goneRunsSheetUrl(gid));
    if (!res.ok) throw new Error('day fetch failed');
    const text = await res.text();
    const map = new Map();
    parseCSV(text).forEach(row => {
      const runno = (row['run#'] || '').trim();
      if (runno) map.set(runno, { opid: (row['opid'] || '').trim(), off: (row['off'] || '').trim() });
    });
    STATE.goneRuns[day] = map;
  } catch (e) {
    console.log(`gone-runs fetch failed for ${day}`);
  }
}

async function refreshGoneRuns() {
  const isCallowhillFall = STATE.currentDistrict === GONE_RUNS_DISTRICT;
  STATE.goneRunsEnabled = false;
  if (!isCallowhillFall) {
    STATE.goneRuns = {};
    updateGoneRunsUI();
    return;
  }
  await loadGoneRunsConfig();
  if (STATE.goneRunsEnabled) {
    for (const day of Object.keys(GONE_RUNS_DAY_GIDS)) {
      await loadGoneRunsForDay(day);
    }
  } else {
    STATE.goneRuns = {};
  }
  updateGoneRunsUI();
}

function updateGoneRunsUI() {
  const wrap = document.getElementById('gone-runs-toolbar');
  if (!wrap) return;
  const show = STATE.currentDistrict === GONE_RUNS_DISTRICT && STATE.goneRunsEnabled;
  wrap.style.display = show ? '' : 'none';
  if (!show) { STATE.showOpenOnly = false; return; }
  document.getElementById('gone-runs-updated').textContent =
    STATE.goneRunsUpdated ? `Updated: ${STATE.goneRunsUpdated}` : 'Updated: —';
  const btn = document.getElementById('btn-open-only');
  btn.classList.toggle('active', STATE.showOpenOnly);
  btn.textContent = STATE.showOpenOnly ? 'Open Runs Only ✓' : 'Open Runs Only';
}

function toggleOpenOnly() {
  STATE.showOpenOnly = !STATE.showOpenOnly;
  updateGoneRunsUI();
  render();
}

function parseFullDateTime(dateTimeStr) {
  if (!dateTimeStr) return new Date(0);
  try {
    const parts = dateTimeStr.split(' ');
    const [year, month, day] = parts[0].split('-').map(Number);
    const [hours, minutes] = parts[1].split(':').map(Number);
    const ampm = parts[2];
    let hour = hours;
    if (ampm === 'AM' && hours === 12) hour = 0;
    if (ampm === 'PM' && hours !== 12) hour += 12;
    return new Date(year, month - 1, day, hour, minutes);
  } catch (e) { return new Date(0); }
}

function getRunRoutes(run) {
  const routes = [];
  for (let i = 1; i <= 10; i++) {
    const route = run['r' + i];
    if (route && route.trim()) routes.push(route.trim());
  }
  return routes;
}

function initSeasons() {
  const select = document.getElementById('season-select');
  if (!SEASONS || SEASONS.length === 0) {
    document.getElementById('board').innerHTML = `<div class="error">No seasons configured</div>`;
    return;
  }

  select.innerHTML = SEASONS
    .map(s => `<option value="${s.id}">${s.label}</option>`)
    .join('');

  // Only one season left (e.g. summer retired) -> hide the season dropdown
  // so it looks like the original single-dropdown app.
  select.style.display = SEASONS.length > 0 ? '' : 'none';

  const saved = localStorage.getItem('paddleSeason');
  const validSaved = SEASONS.find(s => s.id === saved);
  select.value = validSaved ? saved : SEASONS[0].id;
  changeSeason();
}

async function changeSeason() {
  const select = document.getElementById('season-select');
  const season = SEASONS.find(s => s.id === select.value) || SEASONS[0];
  STATE.currentSeason = season.id;
  localStorage.setItem('paddleSeason', season.id);

  try {
    const response = await fetch(season.manifest);
    if (!response.ok) throw new Error('Manifest not found');
    STATE.manifest = await response.json();
    initializeDistricts();
  } catch (e) {
    document.getElementById('board').innerHTML = `<div class="error">Error loading districts: ${e.message}</div>`;
  }
}

function initializeDistricts() {
  const select = document.getElementById('district-select');
  if (!STATE.manifest || !STATE.manifest.districts || STATE.manifest.districts.length === 0) {
    select.innerHTML = '<option>No districts available</option>';
    return;
  }
  select.innerHTML = STATE.manifest.districts
    .map(d => `<option value="${d.name}">${d.label || d.name}</option>`)
    .join('');
  if (STATE.manifest.districts.length > 0) {
    const saved = localStorage.getItem('paddleDepot_' + STATE.currentSeason);
    const validSaved = STATE.manifest.districts.find(d => d.name === saved);
    select.value = validSaved ? saved : STATE.manifest.districts[0].name;
    changeDistrict();
  }
}

// Bumped on every district load. Each load captures its own token and drops
// its results if a newer load has started meanwhile - otherwise two overlapping
// loads (switch depot twice on a slow connection) both push into STATE.runs and
// every run is counted twice.
let loadToken = 0;

async function changeDistrict() {
  const select = document.getElementById('district-select');
  STATE.currentDistrict = select.value;
  if (!STATE.currentDistrict) return;
  localStorage.setItem('paddleDepot_' + STATE.currentSeason, STATE.currentDistrict);

  const myToken = ++loadToken;

  try {
    STATE.runs = [];
    STATE.availableDays = [];
    STATE.pdfLinks = {};
    STATE.weekInputs = {};
    STATE.showAllSlots = new Set();
    WEEK_DAYS.forEach(d => { STATE.weekInputs[d.key] = ''; });

    // Load into locals, then publish to STATE only if this is still the
    // newest request. Capture the district name too, so a mid-flight switch
    // cannot make us fetch one depot's files under another's name.
    const district = STATE.currentDistrict;
    const districtConfig = STATE.manifest.districts.find(d => d.name === district);
    if (!districtConfig || !districtConfig.days) throw new Error('District configuration not found');

    const runs = [];
    const availableDays = [];
    const pdfLinks = {};

    for (const day of districtConfig.days) {
      const dayLower = day.toLowerCase();
      try {
        const response = await fetch(`data/${district}/${dayLower}.csv`);
        if (myToken !== loadToken) return;          // superseded
        if (!response.ok) continue;
        const csvText = await response.text();
        const dayRuns = parseCSV(csvText);
        if (dayRuns.length > 0) {
          availableDays.push(day);
          dayRuns.forEach(run => { run.day = day; });
          runs.push(...dayRuns);
        }
      } catch (e) { console.log(`${day}.csv not found for ${district}`); }
    }

    availableDays.sort((a, b) => DAY_ORDER.indexOf(a) - DAY_ORDER.indexOf(b));

    try {
      const response = await fetch(`data/${district}/pdfs.csv`);
      if (myToken !== loadToken) return;             // superseded
      if (response.ok) {
        const csvText = await response.text();
        const pdfData = parseCSV(csvText);
        pdfData.forEach(row => {
          const runno = row.runno || '';
          const day = row.day || '';
          if (runno && day) pdfLinks[day + '-' + runno] = { moblink: row.moblink || '', pclink: row.pclink || '' };
        });
      }
    } catch (e) { console.log('pdfs.csv not found'); }

    if (myToken !== loadToken) return;               // superseded
    STATE.runs = runs;
    STATE.availableDays = availableDays;
    STATE.pdfLinks = pdfLinks;

    buildBoard();
    render();

    await refreshGoneRuns();
    if (myToken !== loadToken) return;      // superseded
    render();
  } catch (e) {
    if (myToken !== loadToken) return;
    document.getElementById('board').innerHTML = `<div class="error">Error loading district: ${e.message}</div>`;
  }
}

// Which roster backs a weekday slot. An exact manifest day name wins (so a
// district can ship monday.csv); Mon-Fri otherwise fall back to the
// district's Weekday roster.
function sourceDayFor(weekDay) {
  const days = STATE.availableDays || [];
  const norm = s => String(s || '').trim().toLowerCase();
  const exact = days.find(d => norm(d) === norm(weekDay));
  if (exact) return exact;
  if (WEEKDAY_SLOTS.has(weekDay)) {
    const fallback = days.find(d =>
      /week\s*day/.test(norm(d)) || norm(d) === 'mon-fri' || norm(d) === 'mon thru fri');
    if (fallback) return fallback;
  }
  return null;
}

// The runs one day column shows. Only that day's own roster is consulted,
// so a number typed under Sunday can never resolve to a Weekday run.
function runsForSlot(weekDay) {
  const source = sourceDayFor(weekDay);
  if (!source) return [];

  const wanted = (STATE.weekInputs[weekDay] || '').trim();
  const showAll = STATE.showAllSlots.has(weekDay);
  if (!wanted && !showAll) return [];

  const goneMap = STATE.goneRuns[source] || new Map();
  const seen = new Set();

  return STATE.runs.filter(r => {
    if (r.day !== source) return false;
    if (wanted && !String(r.runno || '').trim().startsWith(wanted)) return false;
    if (STATE.showOpenOnly && goneMap.has(String(r.runno || '').trim())) return false;
    if (STATE.selectedRun && (r.day + '-' + r.runno) !== STATE.selectedRun) return false;
    const runno = r.runno || '';
    if (seen.has(runno)) return false;
    seen.add(runno);
    return true;
  });
}

// One column per day of the week, starting Sunday. Rebuilt only when the
// district changes, so the inputs keep focus while you type into them.
function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = WEEK_DAYS.map(d => `
    <div class="week-col day-${d.group}" data-day="${d.key}">
      <div class="week-col-head">
        <span class="week-day" title="${d.key}">${d.label}</span>
        <input class="week-input" type="text" maxlength="3" inputmode="numeric"
               placeholder="#" aria-label="${d.key} run number"
               value="${escHtml(STATE.weekInputs[d.key] || '')}"
               oninput="onWeekInput('${d.key}', this.value)">
        <button class="week-all" onclick="toggleSlotAll('${d.key}')" title="Show every ${d.key} run">All</button>
      </div>
      <div class="week-col-body"></div>
    </div>`).join('');
}

function onWeekInput(dayKey, value) {
  STATE.weekInputs[dayKey] = String(value || '').trim();
  STATE.selectedRun = null;
  render();
}

// "All" shows that day's whole roster. Typing a number still narrows it.
function toggleSlotAll(dayKey) {
  if (STATE.showAllSlots.has(dayKey)) STATE.showAllSlots.delete(dayKey);
  else STATE.showAllSlots.add(dayKey);
  render();
}

// The empty-column message: no roster for that day, no number typed, or no
// match in that day's own file.
function slotHint(day) {
  const source = sourceDayFor(day.key);
  if (!source) return 'No roster';
  const wanted = (STATE.weekInputs[day.key] || '').trim();
  if (wanted) return `No run <b>${escHtml(wanted)}</b>`;
  return 'Enter a run #';
}

function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function sortRuns(runs, sort) {
  const [sk, sd] = sort.split('-');
  return runs.slice().sort((a, b) => {
    let av, bv;
    if (sk === 'run') { av = parseInt(a.runno) || 0; bv = parseInt(b.runno) || 0; return av - bv; }
    else if (sk === 'pay') { av = parseFloat(a.pay) || 0; bv = parseFloat(b.pay) || 0; }
    else if (sk === 'start') { av = parseFullDateTime(a.start).getTime(); bv = parseFullDateTime(b.start).getTime(); }
    else if (sk === 'finish') { av = parseFullDateTime(a.finish).getTime(); bv = parseFullDateTime(b.finish).getTime(); }
    else if (sk === 'swing') { av = parseInt(a.swingdursec) || 0; bv = parseInt(b.swingdursec) || 0; }
    return sd === 'asc' ? av - bv : bv - av;
  });
}

// The card itself - the card CSS is unchanged. Only the day label and the
// colour follow the column the run was found in, so a run pulled from the
// Mon-Fri roster still reads as "Monday" when it sits in the Monday column.
function cardHtml(run, displayDay, group) {
  const pdfLink = STATE.pdfLinks[run.day + '-' + run.runno] || {};
  const paddleLink = isMobile ? pdfLink.moblink : pdfLink.pclink;
  const paddleBtn = paddleLink
    ? `<a class="btn-paddle show" href="${paddleLink}" target="_blank">PADDLE</a>`
    : '';

  const runRoutes = getRunRoutes(run);
  const uniqueRoutes = [...new Set(runRoutes)];
  const routesDisplay = uniqueRoutes.join(' | ');

  let segsHtml = '';
  for (let i = 1; i <= 10; i++) {
    const r = run['r' + i];
    const b = run['b' + i];
    if (!r || !b) break;
    segsHtml += `
      <div class="seg">
        <div class="seg-connector"><div class="seg-dot"></div><div class="seg-line"></div></div>
        <div class="seg-body">
          <div class="seg-top">
            <span class="seg-route">${r}</span>
            <span class="seg-block-label">BLK</span><span class="seg-block">${b}</span>
            <span class="seg-sched">${run['stime' + i] || ''}</span>
          </div>
          <div class="seg-times">
            <span class="seg-time-tag">${run['potype' + i] || ''}</span>
            <span>${run['pot' + i] || ''}</span>
            <span class="seg-arrow">-&gt;</span>
            <span class="seg-time-tag">${run['pitype' + i] || ''}</span>
            <span>${run['pit' + i] || ''}</span>
          </div>
        </div>
      </div>`;
  }

  const startTime = (run.start || '').split(' ').slice(1, 3).join(' ');
  const finishTime = (run.finish || '').split(' ').slice(1, 3).join(' ');

  let swingHtml = '';
  if (run.pullout2) {
    swingHtml = `<div class="swing-section"><div class="swing-label">Swing:</div><div class="swing-value">${run.swingdur || '&mdash;'}</div></div>`;
  }

  const goneMap = STATE.goneRuns[run.day] || new Map();
  const goneInfo = goneMap.get(String(run.runno || '').trim());
  const pickedBadge = goneInfo
    ? `<div class="run-picked-badge">Picked : ${goneInfo.opid || '&mdash;'}</div>`
    : '';

  return `
    <div class="card day-${group}" onclick="selectRun('${run.day}','${run.runno}')">
      <div class="card-head">
        <div class="card-head-top">
          ${pdfLink.pclink ? `<a class="run-num" href="${pdfLink.pclink}" target="_blank" style="text-decoration:none;">${run.runno}</a>` : `<div class="run-num">${run.runno}</div>`}
          <div class="run-day">${displayDay}</div>
          <div class="run-actions">${pickedBadge}${paddleBtn}</div>
        </div>
        <div class="card-head-bottom">
          <div class="run-routes">${routesDisplay || '&mdash;'}</div>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat"><div class="stat-label">Start</div><div class="stat-val">${startTime || '&mdash;'}</div></div>
        <div class="stat"><div class="stat-label">Finish</div><div class="stat-val">${finishTime || '&mdash;'}</div></div>
        <div class="stat"><div class="stat-label">Pay hrs</div><div class="stat-val pay">${run.pay || '&mdash;'}</div></div>
      </div>
      ${swingHtml}
      ${segsHtml ? `<div class="timeline">${segsHtml}</div>` : ''}
    </div>`;
}

function selectRun(day, runno) {
  const key = day + '-' + runno;
  STATE.selectedRun = (STATE.selectedRun === key) ? null : key;
  render();
} // the inputs are left alone so the
// caret stays where you are typing.
function render() {
  const sort = 'run-asc';
  let total = 0;
  let totalPay = 0;
  let totalActualMs = 0;

  WEEK_DAYS.forEach(d => {
    const runs = sortRuns(runsForSlot(d.key), sort);
    total += runs.length;

    runs.forEach(run => {
      totalPay += parseFloat(run.pay) || 0;
      const s = parseFullDateTime(run.start).getTime();
      const f = parseFullDateTime(run.finish).getTime();
      if (f > s) totalActualMs += (f - s);
    });

    const col = document.querySelector(`.week-col[data-day="${d.key}"]`);
    if (!col) return;

    col.querySelector('.week-col-body').innerHTML = runs.length
      ? runs.map(run => cardHtml(run, d.key, d.group)).join('')
      : `<div class="week-hint">${slotHint(d)}</div>`;

    const allBtn = col.querySelector('.week-all');
    const on = STATE.showAllSlots.has(d.key);
    allBtn.classList.toggle('active', on);
    allBtn.title = on ? `Showing every ${d.key} run` : `Show every ${d.key} run`;
  });


  const actualHrs = (totalActualMs / 3600000).toFixed(2);
  document.getElementById('summary').innerHTML =
    `<div class="sc-item"><div class="sc-label">Total Pay Hrs</div><div class="sc-val pay">${totalPay.toFixed(2)}</div></div>` +
    `<div class="sc-item"><div class="sc-label">Actual Time Worked</div><div class="sc-val">${actualHrs} h</div></div>`;
}

initSeasons();
</script>
